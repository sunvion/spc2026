<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pac-Man 움직임 + 회전</title>
<style>
    #game {
        position: relative;
        width: 500px;
        height: 500px;
        background: black;
        overflow: hidden;
    }

    #pacman {
        position: absolute;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        background: yellow;
        top: 100px;
        left: 100px;
        transform-origin: center center;
        transition: transform 0.1s; /* 회전 부드럽게 */
    }

    #mouth {
        position: absolute;
        width: 50px;
        height: 50px;
        background: black;
        clip-path: polygon(100% 50%, 0 0, 0 100%);
        top: 0;
        left: 0;
    }
</style>
</head>
<body>

<div id="game">
    <div id="pacman">
        <div id="mouth"></div>
    </div>
</div>

<script>
    const pacman = document.getElementById("pacman");

    // 위치와 방향 변수
    let x = 100; // 왼쪽 위치
    let y = 100; // 위쪽 위치
    let dir = "right";

    // 방향에 따라 회전
    function updateDirection(direction) {
        let angle = 0;
        if(direction === "right") angle = 0;
        if(direction === "down") angle = 90;
        if(direction === "left") angle = 180;
        if(direction === "up") angle = 270;

        pacman.style.transform = `rotate(${angle}deg)`;
    }

    // 키 이벤트: 이동 + 방향 변경
    document.addEventListener("keydown", function(e) {
        const step = 10; // 한 번 누를 때 이동 거리

        if(e.key === "ArrowRight") {
            x += step;
            dir = "left";
        }
        if(e.key === "ArrowLeft") {
            x -= step;
            dir = "right";
        }
        if(e.key === "ArrowUp") {
            y -= step;
            dir = "down";
        }
        if(e.key === "ArrowDown") {
            y += step;
            dir = "up";
        }

        // 화면 밖으로 나가지 않게 제한
        x = Math.max(0, Math.min(x, 500 - 50));
        y = Math.max(0, Math.min(y, 500 - 50));

        pacman.style.left = x + "px";
        pacman.style.top = y + "px";

        updateDirection(dir);
    });
</script>

</body>
</html>
