{% extends 'layout.html' %}

{% block content %}

{% if user %}
    <h2>{{ user.name }}님 환영합니다!</h2>
    <a href="{{ url_for('logout') }}">로그아웃</a>
{% else %}
    <h2>✌️환영합니다!</h2>
    <a href="{{ url_for('login') }}">
        로그인
    </a>
    <br><br>
    <a href="{{ url_for('products') }}">
        상품 목록 보기
    </a>
{% endif %}

{% endblock %}
