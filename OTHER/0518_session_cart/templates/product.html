{% extends 'layout.html' %}

{% block content %}

<h1>상품 목록</h1>

<ul>
    {% for item in items %}
    <li>
        {{ item.name }} (가격: {{ item.price }}원)
        <a href="{{ url_for('add_to_cart', item_id=item.id) }}">
            추가
        </a>
    </li>
    {% endfor %}
</ul>

<a href="{{ url_for('view_cart') }}">
    장바구니 보기
</a>

{% endblock %}
