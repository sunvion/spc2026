<canvas id="myCanvas" width="500" height="500" style="background:black;"></canvas>
<script>
// 1️⃣ 캔버스 요소 가져오기
const canvas = document.getElementById('myCanvas'); 
// -> HTML에서 <canvas id="myCanvas">를 선택해서 JS 변수에 저장

// 2️⃣ 2D 그리기 컨텍스트 가져오기
const ctx = canvas.getContext('2d'); 
// -> 캔버스 위에 그림을 그릴 수 있는 "연필" 역할 객체

// 3️⃣ 팩맨 위치와 크기, 방향, 입 상태 변수
let x = 250;        // 팩맨의 x 좌표 (캔버스 좌측 기준)
let y = 250;        // 팩맨의 y 좌표 (캔버스 상단 기준)
let radius = 50;    // 팩맨 반지름
let dir = "right";  // 현재 팩맨 방향 ("right", "left", "up", "down")
let mouthOpen = true; // 입이 벌려진 상태(true) / 닫힌 상태(false)
let angleOffset = Math.PI / 4; // 입 벌림 각도 (45도)

// 4️⃣ 키보드 입력 한 번에 이동 거리
const step = 10; 

// 5️⃣ 팩맨 그리기 함수 정의
function drawPacman() {
    // 5-1️⃣ 캔버스 초기화 (이전 프레임 그림 제거)
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    let startAngle, endAngle; // 팩맨 입 시작/끝 각도

    // 5-2️⃣ 입 벌림 상태에 따라 시작/끝 각도 조정
    const offset = mouthOpen ? angleOffset : 0.05; 
    // -> 입 벌림이면 큰 각도, 닫힘이면 거의 0으로

    // 5-3️⃣ 방향에 따라 각도 계산
    switch(dir) {
        case "right":
            startAngle = offset;            // 오른쪽은 0 ~ 2π 기준
            endAngle = 2*Math.PI - offset;
            break;
        case "left":
            startAngle = Math.PI + offset;  // 왼쪽으로 뒤집기
            endAngle = Math.PI*3 - offset;
            break;
        case "up":
            startAngle = -Math.PI/2 + offset;  // 위쪽
            endAngle = Math.PI*3/2 - offset;
            break;
        case "down":
            startAngle = Math.PI/2 + offset;   // 아래쪽
            endAngle = Math.PI*5/2 - offset;
            break;
    }

    // 5-4️⃣ 캔버스에 팩맨 그리기
    ctx.beginPath();             // 새로운 도형 시작
    ctx.moveTo(x, y);           // 중심 좌표로 이동
    ctx.arc(x, y, radius, startAngle, endAngle); // 원호 그리기
    ctx.closePath();             // 시작점과 끝점 연결 (삼각형 입 모양)
    ctx.fillStyle = "yellow";   // 노란색으로 채우기
    ctx.fill();                  // 채우기 적용
    ctx.strokeStyle = "yellow";  // 테두리 색상
    ctx.stroke();                // 테두리 그리기
}

// 6️⃣ 키보드 이벤트: 방향 + 이동 + 입 토글
document.addEventListener("keydown", function(e) {
    // 6-1️⃣ 방향키 입력 시 좌표 변경
    if(e.key === "ArrowRight") { x += step; dir = "right"; }
    if(e.key === "ArrowLeft")  { x -= step; dir = "left"; }
    if(e.key === "ArrowUp")    { y -= step; dir = "up"; }
    if(e.key === "ArrowDown")  { y += step; dir = "down"; }

    // 6-2️⃣ 화면 밖 이동 제한 (캔버스 안에만 있게)
    x = Math.max(radius, Math.min(canvas.width - radius, x));
    y = Math.max(radius, Math.min(canvas.height - radius, y));

    // 6-3️⃣ 키 입력마다 입 벌렸다 닫히도록 토글
    mouthOpen = !mouthOpen;

    // 6-4️⃣ 팩맨 새 위치 + 방향 + 입 상태 반영
    drawPacman();
});

// 7️⃣ 초기 화면에 팩맨 한 번 그리기
drawPacman();
</script>

<!-- 캔버스와 컨텍스트 → 그림을 그릴 수 있는 기본 준비
x, y, radius, dir, mouthOpen → 팩맨 상태 저장
drawPacman() → 매번 캔버스를 초기화하고, 팩맨 그리는 함수
키 이벤트 → 이동, 방향 전환, 입 벌림 토글
clearRect() → 이전 그림 지우고 새로 그림
arc() + moveTo() + closePath() → 입 모양 있는 원 그리기 -->
