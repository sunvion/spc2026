<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>외부 요청 테스트</h1>
    <input type="number" id="uid">
    <button id="loadBtn">데이터 요청</button>
    <button id="saveBtn">데이터 쓰기</button>
    <button id="delBtn">데이터 삭제</button>
    <button id="modBtn">데이터 수정</button>
    <div id="result"><!-- 응답 데이터를 표시할 곳 --></div>
    <script>
        /* PUT 정보 요청 */
        document.getElementById('modBtn').addEventListener('click', () => {
            const userid = document.getElementById('uid').value;
            console.log('수정할ID: ', userid);

            const putData = {
                title: 'hello',
                body: 'world',
                userId: 1
            };

            fetch(`https://jsonplaceholder.typicode.com/posts/${userid}`, {
                method: 'PUT',
                headers: {
                    'Content-type': 'application/json; charset=UTF-8'
                },
                body: JSON.stringify(putData)
            })
                .then(resp => resp.json())
                .then(data => {
                    console.log(data);
                })
        })

        /* DELETE 정보 요청 */
        document.getElementById('delBtn').addEventListener('click', () => {
            const userid = document.getElementById('uid').value;
            fetch(`https://jsonplaceholder.typicode.com/posts/${userid}`, {
                method: 'DELETE'
            });
        })

        /* POST 정보 요청 */
        document.getElementById('saveBtn').addEventListener('click', () => {
            const postData = {
                title: 'hello',
                body: 'world',
                userId: 1
            };

            /* 이 주소(보내야 할 주소)는 원작자의 문서를 통해서 확인 */
            fetch(`https://jsonplaceholder.typicode.com/posts`, {
                method: 'POST',
                headers: {
                    'Content-type': 'application/json; charset=UTF-8'
                },
                body: JSON.stringify(postData)
            })
                .then(resp => resp.json())
                .then(data => {
                    console.log(data);
                })
        })

        /* GET 정보 요청 */
        document.getElementById('loadBtn').addEventListener('click', () => {

            const userid = document.getElementById('uid').value;

            fetch(`https://jsonplaceholder.typicode.com/users/${userid}`)
                .then(response => response.json())
                .then(data => {
                    console.log(data);
                });

        });
    </script>
</body>
</html>
