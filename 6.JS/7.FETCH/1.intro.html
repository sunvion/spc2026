<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>외부 요청 테스트</h1>
    <button id="loadBtn">데이터 요청</button>
    <div id="result"><!-- 응답 데이터를 표시할 곳 --></div>
    <script>
        document.getElementById('loadBtn').addEventListener('click', () => {
            fetch('http://localhost:5000/api/data').then((response) => {
                if (!response.ok) {
                    console.log('응답이 왔으나 OK가 아님.', response);
                    throw new Error('알 수 없는 오류가 발생했씁니다.');
                }
                console.log('성공적인 응답이 있음. 응답은 여기 담겨있음: ', response)
                return response.json(); // 온 응답이 JSON이니까, 그걸로 자료구조를 만들어라.
            }).then((data) => {
                console.log('최종 파싱이 끝난 JSON 자료 구조가 넘어옴: ', data)
            }).catch((error) => {
                console.log('위에 fetch를 처리하고 가공하는 과정 중 어딘가에서 오류가 났음.')
            })
        })
    </script>
</body>
</html>
