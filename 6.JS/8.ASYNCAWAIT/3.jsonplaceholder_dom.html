<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>외부 요청 테스트</h1>
    <button id="loadBtn">데이터 요청</button>
    <div id="result"><!-- 응답 데이터를 표시할 곳 --></div>
    <script>

    document.getElementById('loadBtn').addEventListener('click', async () => {

        try {
            const response = await fetch('https://jsonplaceholder.typicode.com/todos/1');
            if (!response.ok) {
                console.log('응답이 왔으나 OK가 아님.', response);
                throw new Error('알 수 없는 오류가 발생했습니다.');
            }

            console.log('성공적인 응답이 있음. 응답은 여기 담겨있음:', response);
            const data = await response.json();
            console.log('최종 파싱이 끝난 JSON 자료 구조가 넘어옴:', data);

            // DOM 렌더링
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = `
                <ul>
                    <li>Id: ${data.id}</li>
                    <li>Title: ${data.title}</li>
                </ul>
            `;

        } catch (error) {
            console.log(
                '위에 fetch를 처리하고 가공하는 과정 중 어딘가에서 오류가 났음.',
                error
            );
        }
    });

    </script>
</body>
</html>
