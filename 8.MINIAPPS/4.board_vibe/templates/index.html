<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOARD VIBE — 프리미엄 카드뷰 게시판</title>
    <!-- 구글 폰트 로드 (Outfit 및 Plus Jakarta Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <!-- 프리미엄 한국어 폰트 Pretendard 로드 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    
    <!-- Lucide 아이콘 라이브러리 CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- 사용자 정의 CSS 파일 링크 -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- 고급 테크 격자 그리드 패턴 배경 오버레이 -->
    <div class="grid-overlay"></div>
    
    <!-- 배경을 풍부하게 만드는 그라데이션 오버레이 원형 데코레이션 -->
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <div class="app-container">
        <!-- 헤더 영역 -->
        <header class="app-header">
            <div class="logo-wrapper">
                <i data-lucide="sparkles" class="logo-icon"></i>
                <h1 id="app-main-title" class="logo-text">BOARD <span>VIBE</span></h1>
            </div>
            <p class="app-subtitle">당신의 생각과 영감을 카드 뷰로 나누어보세요.</p>
        </header>

        <main class="app-main">
            <!-- 글 작성 폼 세션 -->
            <section class="form-section">
                <div class="glass-card form-card">
                    <div class="card-header">
                        <i data-lucide="pen-tool" class="header-icon"></i>
                        <h2>새로운 생각 공유하기</h2>
                    </div>
                    
                    <form id="post-form" class="board-form" novalidate>
                        <!-- 제목 입력란 -->
                        <div class="form-group">
                            <label for="title-input">
                                <i data-lucide="heading" class="input-label-icon"></i> 제목
                            </label>
                            <div class="input-wrapper">
                                <input 
                                    type="text" 
                                    id="title-input" 
                                    placeholder="어떤 주제로 대화해 볼까요?" 
                                    required 
                                    maxlength="100"
                                    autocomplete="off"
                                >
                                <span class="char-counter" id="title-counter">0/100</span>
                            </div>
                        </div>

                        <!-- 내용 입력란 -->
                        <div class="form-group">
                            <label for="message-input">
                                <i data-lucide="message-square-quote" class="input-label-icon"></i> 내용
                            </label>
                            <div class="input-wrapper">
                                <textarea 
                                    id="message-input" 
                                    placeholder="공유하고 싶은 상세 내용을 적어주세요..." 
                                    rows="4" 
                                    required
                                    maxlength="1000"
                                ></textarea>
                                <span class="char-counter" id="message-counter">0/1000</span>
                            </div>
                        </div>

                        <!-- 등록 버튼 -->
                        <button type="submit" id="submit-btn" class="submit-button">
                            <span>등록하기</span>
                            <i data-lucide="arrow-right" class="btn-arrow-icon"></i>
                        </button>
                    </form>
                </div>
            </section>

            <!-- 구분선 및 게시글 통계 -->
            <div class="section-divider">
                <span class="divider-line"></span>
                <span class="posts-count-badge">
                    <i data-lucide="layers" class="badge-icon"></i>
                    <span id="posts-count">0</span>개의 카드
                </span>
                <span class="divider-line"></span>
            </div>

            <!-- 카드뷰 목록 섹션 -->
            <section class="posts-section">
                <!-- 로딩 중 스켈레톤 상태 -->
                <div id="posts-loader" class="posts-loader hidden">
                    <div class="skeleton-card"></div>
                    <div class="skeleton-card"></div>
                    <div class="skeleton-card"></div>
                </div>

                <!-- 비어있을 때 표시되는 상태 -->
                <div id="empty-state" class="empty-state">
                    <div class="empty-illustration">
                        <i data-lucide="inbox" class="empty-icon"></i>
                    </div>
                    <h3>작성된 카드가 아직 없습니다.</h3>
                    <p>상단의 폼을 채워 첫 번째 게시글의 주인공이 되어보세요!</p>
                </div>

                <!-- 실제 카드들이 들어갈 컨테이너 -->
                <div id="posts-container" class="posts-grid">
                    <!-- Dynamic Cards will be rendered here -->
                </div>
            </section>
        </main>

        <!-- 푸터 영역 -->
        <footer class="app-footer">
            <p>&copy; 2026 BOARD VIBE. All rights reserved.</p>
        </footer>
    </div>

    <!-- 토스트 알림 컨테이너 -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Lucide 아이콘 초기화 및 커스텀 스크립트 연결 -->
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
